<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OPC Notes</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
      form { display: grid; gap: 0.5rem; margin-bottom: 1.5rem; }
      li { margin-bottom: 0.75rem; }
      .error { color: #b00020; }
    </style>
  </head>
  <body>
    <h1>OPC Notes</h1>
    <form id="note-form">
      <label>Tiêu đề <input name="title" required maxlength="200" /></label>
      <label>Nội dung <textarea name="body" rows="3" maxlength="5000"></textarea></label>
      <button type="submit">Thêm ghi chú</button>
      <p class="error" id="error" role="alert"></p>
    </form>
    <ul id="notes"></ul>
    <script type="module">
      const list = document.querySelector("#notes");
      const form = document.querySelector("#note-form");
      const error = document.querySelector("#error");

      function editForm(note) {
        const editor = document.createElement("form");
        const title = document.createElement("input");
        title.value = note.title;
        title.required = true;
        title.maxLength = 200;
        const body = document.createElement("textarea");
        body.value = note.body;
        body.rows = 3;
        body.maxLength = 5000;
        const save = document.createElement("button");
        save.type = "submit";
        save.textContent = "Lưu";
        const cancel = document.createElement("button");
        cancel.type = "button";
        cancel.textContent = "Huỷ";
        cancel.addEventListener("click", refresh);
        const problem = document.createElement("p");
        problem.className = "error";
        problem.setAttribute("role", "alert");
        editor.addEventListener("submit", async (event) => {
          event.preventDefault();
          try {
            const res = await fetch(`/api/notes/${note.id}`, {
              method: "PATCH",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ title: title.value, body: body.value }),
            });
            if (res.ok) return refresh();
            problem.textContent = (await res.json()).error;
          } catch {
            problem.textContent = "Không lưu được, thử lại sau";
          }
        });
        editor.append(title, body, save, cancel, problem);
        return editor;
      }

      async function refresh() {
        const notes = await (await fetch("/api/notes")).json();
        list.replaceChildren(
          ...notes.map((note) => {
            const item = document.createElement("li");
            const title = document.createElement("strong");
            title.textContent = note.title;
            const remove = document.createElement("button");
            remove.textContent = "Xoá";
            remove.addEventListener("click", async () => {
              await fetch(`/api/notes/${note.id}`, { method: "DELETE" });
              refresh();
            });
            const edit = document.createElement("button");
            edit.textContent = "Sửa";
            edit.addEventListener("click", () => item.replaceChildren(editForm(note)));
            item.append(title, " ", note.body, " ", edit, " ", remove);
            if (note.updatedAt) {
              const stamp = document.createElement("small");
              stamp.textContent = ` Sửa lần cuối: ${new Date(note.updatedAt).toLocaleString("vi-VN")}`;
              item.append(stamp);
            }
            return item;
          }),
        );
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(form));
        const res = await fetch("/api/notes", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(data),
        });
        error.textContent = res.ok ? "" : (await res.json()).error;
        if (res.ok) {
          form.reset();
          refresh();
        }
      });

      refresh();
    </script>
  </body>
</html>
